name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Кэш ускоряет повторные сборки: зависимости Tauri компилируются долго.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Run backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build installer
        run: npm run build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fesb-settings-editor-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Собранный exe самодостаточен: установка не нужна, из зависимостей —
      # только WebView2 Runtime, который есть в Windows 10/11 из коробки.
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: fesb-settings-editor-windows-portable
          if-no-files-found: error
          path: src-tauri/target/release/fesb-settings-editor.exe
