      // Отписка от событий идёт мимо __TAURI_INTERNALS__ — без этой заглушки
      // консоль забивается ошибками, которых в самом приложении нет.
      window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} }
      window.__previewListeners = {}
      window.emitPreview = (event, payload) => {
        for (const id of window.__previewListeners[event] ?? []) {
          window[`_${id}`]?.({ event, id, payload })
        }
      }
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: 'main' },
          currentWebview: { windowLabel: 'main', label: 'main' },
        },
        transformCallback: (callback) => {
          const id = Math.floor(Math.random() * 1e9)
          window[`_${id}`] = callback
          return id
        },
        invoke: async (command, args) => {
          // Диалог выбора папки в браузере не откроешь — подставляем путь.
          if (command.startsWith('plugin:dialog')) return '/fake/config'
          // Подписки на события запоминаем, чтобы их можно было позвать
          // из консоли: ход долгих работ иначе в предпросмотре не увидеть.
          //   emitPreview('api:progress', { phase: 'domains', current: 40, total: 256 })
          if (command === 'plugin:event|listen') {
            (window.__previewListeners[args.event] ||= []).push(args.handler)
            return 1
          }
          if (command.startsWith('plugin:')) return 1
          const key = args && args.cmd ? args.cmd : command
          // Любой ответ подменяется из консоли:
          //   localStorage['preview.api_inflight'] = '[]'
          //   localStorage['preview.api_connect'] = '{"__error":"нет связи"}'
          // Так проверяются и пустые состояния, и ветки с ошибкой.
          const override = localStorage.getItem(`preview.${key}`)
          if (override !== null) {
            const value = JSON.parse(override)
            if (value && value.__error) throw new Error(value.__error)
            return value
          }
          if (key === 'read_route') {
            const legacy = localStorage.getItem('preview.route')
            if (legacy) return JSON.parse(legacy)
          }
          if (key === 'api_domain_action') {
            return { guid: args.guid, action: args.action, done: args.guid.endsWith('516') }
          }
          if (key === 'read_report_history') {
            const entry = DATA.report_history.find((item) => item.id === args.id) ?? DATA.report_history[0]
            return { ...entry, endpoints: DATA.api_endpoint_report }
          }
          if (key === 'api_queue_search') {
            const needle = String(args.needle || '')
            return [
              { id: DATA.api_queue_messages[3].id, excerpt: `…<order><number>4815162342</number><status>${needle}</status></order>…` },
              { id: DATA.api_queue_messages[1].id, excerpt: `…<doc><type>СчётФактура</type><state>${needle}</state></doc>…` },
            ]
          }
          if (key in DATA) return DATA[key]
          return []
        },
      }
